<!doctype html>
{% extends "base.html" %} {% block title %}Skapa diskussion Forum för
fårskallar{% endblock %} {% block content %}

<div class="form-box">
  <h1>Skapa en ny diskussion</h1>

  <form method="POST">
    <label for="title">Rubrik</label>
    <input type="text" id="title" name="title" maxlength="150" required />

    <label for="content">Första inlägget</label>
    <textarea
      id="content"
      name="content"
      placeholder="Vad vill du diskutera?"
      required
    ></textarea>

    <button type="submit">Skapa diskussion</button>
  </form>
</div>

{% endblock %}
